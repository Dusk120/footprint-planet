# 足迹星球：全容器化部署编排
# 用法：docker compose up -d --build
# 启动前请先阅读 README 部署说明，并替换下方 CHANGE-ME 占位的密钥/密码

services:
  mysql:
    # 自定义构建：建库脚本打进镜像，避免运行时 bind mount 的本地路径问题（兼容远程 Docker 构建）
    build:
      context: ./sql
      dockerfile: Dockerfile
    container_name: fp-mysql
    restart: unless-stopped
    networks:
      - fp-network
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # 北京时间：镜像默认 UTC，会让 CURRENT_TIMESTAMP 比后端写入的 LocalDateTime 差 8 小时
      TZ: Asia/Shanghai
    # 项目按 MySQL 8 + utf8mb4 开发（JSON 列、外键级联）
    # 小内存机器压低 InnoDB 缓冲池与连接数
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 显式固定会话时区，不依赖镜像内 tzdata 是否完整（中国无夏令时，+08:00 恒定）
      - --default-time-zone=+08:00
      - --innodb-buffer-pool-size=128M
      - --max_connections=80
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      # 注意：backend 走 Docker 内部网络连 mysql:3306，不受此映射影响，保持 3306 即可
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: fp-redis
    restart: unless-stopped
    networks:
      - fp-network
    ports:
      # backend 走 Docker 内部网络连 redis:6379，不受此映射影响
      - "6380:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fp-backend
    restart: unless-stopped
    networks:
      - fp-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      # 覆盖默认 dev profile，避免加载本地 application-dev.yml；配置全部走环境变量
      SPRING_PROFILES_ACTIVE: prod

      # 北京时间：JRE 镜像默认 UTC，会让「旅行天数」「近 7 天趋势」按 UTC 日期切分
      # 与 JVM 参数双保险：TZ 影响日志时间戳，-Duser.timezone 用 JDK 自带时区库，不依赖镜像 tzdata
      TZ: Asia/Shanghai

      # ===== MySQL（指向服务名 mysql，而非 localhost）=====
      FOOTPRINT_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      FOOTPRINT_DATASOURCE_HOST: mysql
      FOOTPRINT_DATASOURCE_PORT: "3306"
      FOOTPRINT_DATASOURCE_DATABASE: footprint_planet
      FOOTPRINT_DATASOURCE_USERNAME: root
      FOOTPRINT_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}

      # ===== Redis（指向服务名 redis）=====
      FOOTPRINT_REDIS_HOST: redis
      FOOTPRINT_REDIS_PORT: "6379"
      FOOTPRINT_REDIS_PASSWORD: ""

      # ===== JWT：务必替换为自己的 ≥32 字节随机串 =====
      FOOTPRINT_JWT_SECRET_KEY: ${FOOTPRINT_JWT_SECRET_KEY}
      FOOTPRINT_JWT_TTL: "7200000"
      FOOTPRINT_JWT_TOKEN_NAME: Authorization

      # 前端访问地址（拼邀请链接用）：容器化后前端走 81 端口
      FOOTPRINT_FRONTEND_URL: ${FOOTPRINT_FRONTEND_URL:-}

      # 高德 Web 服务 key（可选；不填则「出行方案」算路降级为直线）
      FOOTPRINT_AMAP_WEB_KEY: ${FOOTPRINT_AMAP_WEB_KEY:-}

      # ===== 阿里云 OSS（图片上传）=====
      # 缺这几项时应用能启动，但所有上传接口会返回 503「图片服务暂不可用」
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
      ALIYUN_OSS_BUCKET_NAME: ${ALIYUN_OSS_BUCKET_NAME}
      ALIYUN_OSS_URL_PREFIX: ${ALIYUN_OSS_URL_PREFIX}

      # 小内存机器压低 JVM 堆，降低 OOM 风险；时区与上面的 TZ 保持一致
      JAVA_OPTS: -Xms128m -Xmx320m -Duser.timezone=Asia/Shanghai
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fp-frontend
    restart: unless-stopped
    networks:
      - fp-network
    depends_on:
      - backend
    environment:
      # 北京时间：Nginx 访问日志的 $time_local 取系统时区，统一后便于和后端日志对齐排查
      TZ: Asia/Shanghai
    ports:
      - "81:80"

# 显式定义网络：所有服务加入同一网络，通过服务名（mysql / redis / backend）互相访问
networks:
  fp-network:
    driver: bridge

volumes:
  mysql-data:
