server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传体积上限：Nginx 默认只有 1MB，而后端 multipart 上限是 10MB，
    client_max_body_size 12m;

    # 静态资源压缩：地图数据 china-provinces-geo.json 约 3.7MB，官方镜像默认不开 gzip，
    # 不开的话首次进「足迹点亮」要明文传这个文件，首屏明显卡顿（gzip 后可降到 500KB 左右）。
    # text/html 由 gzip on 隐式覆盖，无需显式列出。
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vue Router history 模式：未命中的路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 代理后端 REST 接口到 backend 容器
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 代理 WebSocket（STOMP /ws）
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
