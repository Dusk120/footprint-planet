spring:
  application:
    name: Footprint_Planet
  # 默认激活 dev，账号密码集中在 application-dev.yml，部署新环境时另建 application-{env}.yml 切换
  profiles:
    active: dev
  # ===== MySQL datasource（连接目标 / 账号密码见 application-dev.yml 的 footprint.datasource.*）=====
  datasource:
    driver-class-name: ${footprint.datasource.driver-class-name}
    url: jdbc:mysql://${footprint.datasource.host}:${footprint.datasource.port}/${footprint.datasource.database}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${footprint.datasource.username}
    password: ${footprint.datasource.password}
  # ===== Redis（连接信息见 application-dev.yml 的 footprint.redis.*）=====
  data:
    redis:
      host: ${footprint.redis.host}
      port: ${footprint.redis.port}
      password: ${footprint.redis.password:}
  servlet:
    multipart:
      # 单个文件上限（与前端校验一致；前端允许 ≤10MB）
      max-file-size: 10MB
      # 整个 multipart 请求体上限（文件 + boundary + 各字段头信息）。
      # 必须大于 max-file-size，否则「正好 10MB」的文件会因请求体超出而被拒
      # （max-request-size 与 max-file-size 相等是个坑，10MB 文件实测会 500）。
      max-request-size: 12MB

# ===== MyBatis-Plus =====
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.qzxx.footprint_planet.entity
  configuration:
    map-underscore-to-camel-case: true

# ===== JWT（签名密钥）=====
jwt:
  # 设置jwt签名加密时使用的秘钥
  secret-key: ${footprint.jwt.secret-key}
  # 设置jwt过期时间
  ttl: ${footprint.jwt.ttl}
  # 设置前端传递过来的令牌名称
  token-name: ${footprint.jwt.token-name}

# ===== 应用配置 =====
app:
  # 前端地址（拼邀请链接 link 用），真实值在 application-dev.yml 的 footprint.frontend-url
  frontend-url: ${footprint.frontend-url}

# ===== 阿里云 OSS（图片上传）=====
aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME}
    url-prefix: ${ALIYUN_OSS_URL_PREFIX}