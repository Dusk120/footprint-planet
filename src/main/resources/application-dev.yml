# ========== 本地开发配置：账号密码集中填写处 ==========
# 换库 / 部署新环境 / 申请到云账号后，只需改本文件即可。

# ---- 数据库（对应 sql/footprint_planet.sql 建好的库）----
footprint:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: localhost
    port: 3306
    database: footprint_planet
    username:
    password:
  # ---- Redis ----
  redis:
    host: localhost
    port: 6379
    password: ''          # 无密码时留空即可；Redis 设了密码则填上

# ---- 阿里云 OSS（图片上传用）----
aliyun:
  oss:
    endpoint: https://oss-cn-hangzhou.aliyuncs.com
    access-key-id: your-access-key-id
    access-key-secret: your-access-key-secret
    bucket-name: your-bucket-name
    url-prefix: https://your-bucket.oss-cn-hangzhou.aliyuncs.com
